services:
  mongo-router01:
    hostname: mongo-router01
    container_name: mongo-router01
    image: mongo:8.0-noble
    command:
      - /usr/local/bin/mongo-sharded-entrypoint.sh
      - mongos
      - --bind_ip_all
      - --configdb
      - rs-cfg/mongo-cfg-a:27017,mongo-cfg-b:27017,mongo-cfg-c:27017
      - --port
      - "27017"
    ports:
      - "27029:27017"
    volumes:
      - ./docker-entrypoint.sh:/usr/local/bin/mongo-sharded-entrypoint.sh:ro
      - ./mongo-keyfile:/run/config/mongo-keyfile:ro

